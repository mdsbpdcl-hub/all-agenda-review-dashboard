name: Build All-Agenda Review

# Runs when the Apps Script updater saves new inputs (about 10:15 and 11:45 IST), or by hand.
on:
  push:
    branches: [main]
    paths: ['build/data_in/**', 'docs/news/clips.json']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-review
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q openpyxl
      - name: Build
        env:
          TZ: Asia/Kolkata
        run: bash build/build_from_inputs.sh
      - name: Save the page
        run: |
          git config user.name "review-bot"
          git config user.email "review-bot@users.noreply.github.com"
          git add docs/review.json docs/news/news_index.json build/fallback
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update review figures $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M')"
          git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          git push
