name: Update All-Agenda Review

on:
  schedule:
    - cron: '0 5 * * *'    # 10:30 IST
    - cron: '30 6 * * *'   # 12:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-review
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check the Google key is set
        id: key
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
        run: |
          if [ -z "$GOOGLE_SA_KEY" ]; then echo "GOOGLE_SA_KEY secret is not set yet - nothing to do."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: '3.12'
      - name: Install
        if: steps.key.outputs.ok == 'true'
        run: pip install -q openpyxl google-api-python-client google-auth
      - name: Fetch, build, publish
        if: steps.key.outputs.ok == 'true'
        env:
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          TZ: Asia/Kolkata
        run: bash build/update.sh
      - name: Commit
        if: steps.key.outputs.ok == 'true'
        run: |
          git config user.name "review-bot"
          git config user.email "review-bot@users.noreply.github.com"
          git add docs build/fallback
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update review figures $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M')"
          git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          git push
